name: check
on:
  # The Worker's cron starts this every 10 min (workflow_dispatch), and "Check now" in the app does too.
  # GitHub's own schedule is late or skipped on small repos, so it is only an hourly fallback here.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write  # keep-alive step below
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: checker/requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('checker/requirements.txt') }}
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: python check.py
        env:
          API_URL: ${{ secrets.API_URL }}
          CHECKER_TOKEN: ${{ secrets.CHECKER_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API resets that timer, so every scheduled run keeps itself alive.
      - name: Keep schedule alive
        if: always() && github.event_name == 'schedule'
        working-directory: .
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
