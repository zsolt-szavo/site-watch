name: worker
# Deploys the Cloudflare Worker whenever worker/ changes on main (the PWA has its own pages.yml).
# Needs repo secret CLOUDFLARE_API_TOKEN: a Cloudflare API token from the "Edit Cloudflare Workers"
# template, limited to the personal account pinned as account_id in worker/wrangler.toml.
on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/worker.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed (see worker.yml header)."
            exit 1
          fi
          npx wrangler deploy
