name = "site-watch"
main = "src/index.js"
account_id = "9606c02b140d15031c968157eb7cee51" # personal account (zsoltszv@gmail.com), not the work one
compatibility_date = "2025-06-01"

[vars]
# Comma-separated origins allowed to call the API (the GitHub Pages URL + local dev).
ALLOWED_ORIGINS = "https://zsolt-szavo.github.io,http://localhost:8000,http://127.0.0.1:8000"
VAPID_PUBLIC_KEY = "BDHINJK7bO3xMpSf-WFTRrPRcy9gmKZX1sMNHwv570ex-iTsHRCu_LhgP_vxtHWgx7muJPB-Dfl9pHgr1OsIw04"
MAX_WATCHES = "50"            # across all devices
MAX_WATCHES_PER_DEVICE = "5"

# Secret (wrangler secret put …; locally in .dev.vars): CHECKER_TOKEN

# Public API: at most 60 requests per minute per IP address.
[[ratelimits]]
name = "API_LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "site-watch"
database_id = "3b11cf6a-9531-4b71-998e-bcd01abea42f"
